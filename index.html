<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LunaCycle — Period &amp; Fertility Tracker</title>
    <meta name="description" content="Menstruation period tracker, fertility forecaster, hormonal insights, and offline-first PWA synced with Google Sheets Apps Script." />
    <meta property="og:title" content="LunaCycle — Period & Fertility Tracker" />
    <meta property="og:description" content="Menstruation period tracker, fertility forecaster, hormonal insights, and offline-first PWA synced with Google Sheets Apps Script." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FAF8F7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LunaCycle" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('lunacycle_theme') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0E0D11');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F7] text-[#1A1618] dark:bg-[#0E0D11] dark:text-[#F4EFF2] antialiased selection:bg-rose-200 selection:text-rose-950 dark:selection:bg-rose-900/60 dark:selection:text-rose-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
